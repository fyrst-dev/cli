[package]
name = "fyrst-cli"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "fyrst.dev global CLI"
repository = "https://github.com/fyrst-dev/cli"
readme = "README.md"
publish = false

[[bin]]
name = "fyrst-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.41", features = ["derive"] }

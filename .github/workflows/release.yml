# Build Linux release tarballs and attach them to the GitHub Release for tag v*.
# Existing ci.yml (check + test on PR/push) is unchanged.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            strip: strip
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            extra_apt: gcc-aarch64-linux-gnu
            strip: aarch64-linux-gnu-strip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install aarch64 linker
        if: matrix.extra_apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.extra_apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo build --release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/fyrst-cli"
          test -f "$bin"
          strip_cmd="${{ matrix.strip }}"
          if [ -n "$strip_cmd" ] && command -v "$strip_cmd" >/dev/null 2>&1; then
            "$strip_cmd" "$bin" || true
          fi
          stage="$(mktemp -d)"
          cp "$bin" "${stage}/fyrst-cli"
          chmod 0755 "${stage}/fyrst-cli"
          tar -C "$stage" -czf "fyrst-cli-${{ matrix.target }}.tar.gz" fyrst-cli
          tar -tzf "fyrst-cli-${{ matrix.target }}.tar.gz"
          ls -lh "fyrst-cli-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: fyrst-cli-${{ matrix.target }}
          path: fyrst-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: github-release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum fyrst-cli-*.tar.gz | tee SHA256SUMS
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
